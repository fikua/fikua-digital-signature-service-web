sonar.organization=fikua
sonar.projectKey=fikua_fikua-digital-signature-service-web
sonar.projectName=fikua-digital-signature-service-web

sonar.sources=.
# base.css is prototype-style's shared stylesheet, copied as it is.
sonar.exclusions=**/*_test.go,**/*.test.js,internal/web/dist/**,web/node_modules/**,prototype/**,web/src/styles/base.css
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.js

sonar.go.coverage.reportPaths=coverage.out
# cmd/ only reads config and wires packages; the page's views are checked end
# to end (README), its pure helpers by node --test.
sonar.coverage.exclusions=cmd/**,web/**
sonar.go.tests.reportPaths=test-report.json
